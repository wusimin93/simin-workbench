<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5ecd7">
<title>思敏工作台</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --cream:#f5ecd7;        /* 奶油米色 */
  --coffee:#efe3d0;       /* 浅咖色 通用页面底色 */
  --pink:#ffe4ec;         /* 恋爱浅粉 */
  --blue:#e3f0fb;         /* 随心淡蓝 */
  --accent:#1f3a93;       /* 深蓝点缀 */
  --warn:#e23b3b;         /* 红色警示 */
  --line:#d8c9ad;
  --text:#3a3327;
  --muted:#8a8270;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;color:var(--text);}
body{background:var(--coffee);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;}
.round{font-family:"Comic Sans MS","PingFang SC",sans-serif;}

/* ===== Layout ===== */
#app{display:flex;height:100vh;overflow:hidden;}
#sidebar{width:210px;flex:0 0 210px;background:var(--cream);border-right:2px solid var(--line);display:flex;flex-direction:column;transition:transform .25s,margin-left .25s;}
#sidebar .brand{display:flex;align-items:center;gap:8px;padding:14px 12px;border-bottom:1px dashed var(--line);position:relative;}
#sidebar .brand .logo{font-size:22px;font-weight:700;color:var(--accent);}
#sidebar .brand .tools{margin-left:auto;display:flex;gap:4px;}
#sidebar .brand .tools button{font-size:16px;width:30px;height:30px;border-radius:8px;background:transparent;border:none;cursor:pointer;}
#sidebar .nav{flex:1;overflow-y:auto;padding:8px 6px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:11px 10px;border-radius:12px;margin:3px 2px;color:var(--text);font-size:15px;transition:.15s;}
.nav-item .ico{font-size:18px;width:22px;text-align:center;}
.nav-item.active{background:var(--accent);color:#fff;}
.nav-item:hover:not(.active){background:#fbf3df;}
#main{flex:1;overflow-y:auto;background:var(--coffee);position:relative;}
.view{padding:20px;min-height:100%;}
.content{position:relative;z-index:1;min-height:100%;padding:20px;}

/* ===== Home ===== */
.home{background:transparent;min-height:100%;}
.home .motto{border:2px dashed var(--accent);border-radius:14px;padding:12px 14px;min-height:54px;font-size:16px;width:100%;resize:none;background:rgba(255,255,255,.5);}
.home .mood-row{display:flex;align-items:center;gap:12px;margin:14px 0;}
.home .mood-emoji{font-size:54px;line-height:1;}
.home .mood-btn{border:2px dashed var(--accent);border-radius:30px;padding:8px 18px;color:var(--accent);font-weight:600;}
.home .img-zone{margin-top:10px;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
.home .img-cell{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#fff;border:1px dashed var(--line);}
.home .img-cell img{width:100%;height:100%;object-fit:cover;}
.home .img-cell .ops{position:absolute;top:4px;right:4px;display:none;gap:4px;}
.home .img-cell:hover .ops{display:flex;}
.home .img-cell .ops button{background:rgba(0,0,0,.55);color:#fff;border-radius:6px;font-size:11px;padding:2px 6px;}
.home .add-img{border:2px dashed var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--accent);cursor:pointer;aspect-ratio:1/1;}

/* ===== Section titles ===== */
.sec-title{font-size:18px;font-weight:700;color:var(--accent);margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.sub-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.sub-tab{border:2px dashed var(--accent);border-radius:20px;padding:6px 16px;color:var(--accent);font-weight:600;background:#fff;}
.sub-tab.active{background:var(--accent);color:#fff;border-style:solid;}
.sub-tab .x{margin-left:6px;opacity:.7;}
.en-top-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.en-mini{font-size:12px;padding:5px 10px;}
.exam-cd{background:var(--accent);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:12px;text-align:center;}
.exam-cd .cd-num{font-size:24px;font-weight:800;line-height:1.2;}
.exam-cd .cd-sub{font-size:12px;opacity:.92;margin-top:3px;}

/* ===== Generic inputs ===== */
.field{margin-bottom:12px;}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;}
.inp,.txt{border:2px solid var(--line);border-radius:14px;padding:9px 12px;width:100%;font-size:15px;background:#fff;}
.txt{resize:vertical;min-height:60px;}
.inp.rounded{border-radius:22px;}
.btn{border-radius:12px;padding:9px 16px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;}
.btn.ghost{background:#fff;border:2px solid var(--accent);color:var(--accent);}
.btn.warn{background:var(--warn);}
.btn-x{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:none;background:var(--warn);color:#fff;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row .field{flex:1;min-width:120px;}

/* ===== Todo ===== */
.cal{background:#fff;border-radius:16px;padding:12px;margin-bottom:14px;}
.cal .chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal .cell{padding:6px 0;text-align:center;border-radius:8px;font-size:13px;background:#faf6ec;}
.cal .cell.today{background:var(--cream);font-weight:700;color:var(--accent);}
.cal .cell.dim{color:#cbbfa6;}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding:3px 0;}

/* ===== Lists with lines ===== */
.line-list{position:relative;}
.line-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);}
.line-item.done .txt-line{text-decoration:line-through;color:var(--muted);}
.txt-line{flex:1;border:none;background:transparent;font-size:16px;border-bottom:1px dashed transparent;outline:none;width:100%;}
.txt-line.warn{color:var(--warn);}
.chk{width:22px;height:22px;border:2px solid var(--accent);border-radius:6px;flex:0 0 22px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;}
.chk.on{background:var(--accent);}
.add-line{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;margin-top:6px;font-size:18px;cursor:pointer;}
.thumb-pop{position:fixed;font-size:60px;pointer-events:none;animation:pop 1s ease forwards;z-index:999;}
@keyframes pop{0%{transform:scale(.3);opacity:0;}30%{transform:scale(1.3);opacity:1;}100%{transform:scale(1) translateY(-40px);opacity:0;}}

/* chart */
.chart-wrap{background:#fff;border-radius:16px;padding:14px;margin-top:10px;}

/* ===== Love ===== */
.love{background:var(--pink);}
.love .love-top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:rgba(255,255,255,.5);border-radius:16px;padding:14px;margin-bottom:14px;}
.love .love-info{flex:1;min-width:200px;}
.love .love-imgs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.love .days{font-size:15px;font-weight:700;}
.love .days b{font-size:26px;color:#e0556e;}
.love .top-img{width:64px;height:64px;border-radius:12px;object-fit:cover;border:2px dashed #f3a9bb;}
.bubble{border:2px dashed #f3a9bb;border-radius:18px;padding:14px 16px;background:#fff;margin-bottom:12px;position:relative;font-size:15px;}
.lm-bubble{padding:18px 18px;font-size:16px;border-width:3px;border-color:#f0a0b8;min-height:64px;display:flex;flex-direction:column;justify-content:center;width:100%;box-sizing:border-box;}
.lm-cd{margin-top:8px;padding-left:2px;font-size:11px;color:var(--muted);line-height:1.4;}
.lm-add-btn{margin-top:8px;display:inline-block;padding:10px 24px;font-size:15px;border-radius:12px;}
.bubble .cd{font-size:11px;color:#e0556e;margin-top:4px;}
.wish-cols{display:flex;flex-direction:column;gap:16px;}
.wish-sec{background:#fff;border:2px dashed #f3a9bb;border-radius:16px;padding:14px;}
.wish-sec h4{margin:0 0 10px;color:#e0556e;font-size:16px;}
.heart{color:#e0556e;}
.small-heart{font-size:13px;}

/* ===== Modal ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:500;padding:16px;}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:20px;}
.modal h3{margin:0 0 14px;color:var(--accent);}
.modal .close{float:right;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;}
.color-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin:8px 0;}
.color-grid button{width:100%;aspect-ratio:1/1;border-radius:6px;border:1px solid rgba(0,0,0,.12);}
.color-fam{font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:700;}

/* admin */
.admin-section{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px;background:#fff;}
.admin-section h4{margin:0 0 10px;color:var(--accent);}
.col-row{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fcfaf3;}
.col-row .ico-btn{cursor:pointer;font-size:18px;}
.col-row .nm{flex:1;font-weight:600;}
.col-row .mini{font-size:12px;padding:3px 8px;border-radius:8px;background:#f0e7d3;color:var(--text);}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#333;color:#fff;padding:12px 22px;border-radius:30px;font-size:15px;z-index:999;opacity:0;transition:.3s;pointer-events:none;}
.toast.show{opacity:1;}
.save-badge{position:fixed;top:14px;right:14px;z-index:400;background:transparent;border:none;box-shadow:none;padding:4px 6px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.save-badge .dot{width:9px;height:9px;border-radius:50%;background:#9fd49f;}
.save-badge.saving .dot{background:#f0c040;}
.undo-btn{position:fixed;left:14px;bottom:18px;z-index:400;background:#fff;border:1px solid var(--line);border-radius:50%;width:44px;height:44px;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.10);cursor:pointer;color:var(--accent);font-weight:600;}
.undo-btn:active{background:#f3ead4;}

/* mobile */
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:450;background:#fff;border:1px solid var(--line);border-radius:12px;width:42px;height:42px;font-size:20px;align-items:center;justify-content:center;}
@media(max-width:760px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:460;transform:translateX(-100%);box-shadow:4px 0 16px rgba(0,0,0,.15);}
  #sidebar.open{transform:translateX(0);}
  .hamburger{display:flex;}
  #main{padding-top:64px;}
  .view{padding:14px;}
  .color-grid{grid-template-columns:repeat(6,1fr);}
}
@media(min-width:761px){
  /* 桌面：向左滑动隐藏侧边栏（折叠，主区域自动扩展） */
  #app.side-hidden #sidebar{margin-left:-210px;}
}
.pwd-mask{filter:blur(6px);}

/* background image layers */
.bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.18;pointer-events:none;z-index:0;}
.view>.content{position:relative;z-index:1;}
</style>
</head>
<body>
<div id="app">
  <button class="hamburger" id="hamburger">☰</button>
  <aside id="sidebar">
    <div class="brand">
      <span class="logo">思</span><span class="logo">敏</span>
      <div class="tools">
        <button id="btnExport" title="导出数据">📤</button>
        <button id="btnAdmin" title="管理员">⚙️</button>
      </div>
    </div>
    <div class="nav" id="nav"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="save-badge" id="saveBadge" style="display:none"><span class="dot"></span><span id="saveText">已保存</span></div>
<button id="btnManualSave" title="手动保存" style="position:fixed;top:14px;right:92px;z-index:400;background:transparent;border:none;box-shadow:none;font-size:18px;padding:4px 6px;cursor:pointer">💾</button>
<button id="btnUndo" class="undo-btn" title="撤销上一步">↩</button>

<script>
/* =========================================================
   思敏工作台  —  单文件应用  (v3)
   数据保存在浏览器 localStorage（本地保存，非云端）
   ========================================================= */
const STORE_KEY='simin_workbench_v3';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const todayStr=()=>new Date().toISOString().slice(0,10);
const esc=s=>(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MAX_IMG_LEN=200000; // 压缩后 data URL 上限（约 150KB），确保移动端 innerHTML/localStorage 不崩
function imgToDataURL(file,maxW=300){
  return new Promise(res=>{
    let done=false;
    const finish=v=>{if(done)return;done=true;res(v);};
    try{
      const r=new FileReader();
      r.onload=e=>{
        const img=new Image();
        img.onload=()=>{
          try{
            let w=img.width||maxW,h=img.height||maxW;
            const sc=Math.min(1,maxW/w);
            w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
            const c=document.createElement('canvas');
            c.width=w;c.height=h;
            c.getContext('2d').drawImage(img,0,0,w,h);
            let q=0.6,url=c.toDataURL('image/jpeg',q);
            while(url&&url.length>MAX_IMG_LEN&&q>0.2){q-=0.1;url=c.toDataURL('image/jpeg',q);}
            finish(url&&url.length<=MAX_IMG_LEN?url:null);
          }catch(_){finish(null);}
        };
        img.onerror=()=>finish(null);
        img.src=e.target.result;
      };
      r.onerror=()=>finish(null);
      r.readAsDataURL(file);
    }catch(_){finish(null);}
  });
}
function safeImgTag(url,w,h){
  try{
    if(!url||typeof url!=='string')return '';
    if(url.length>MAX_IMG_LEN)return '<span style="color:var(--muted);font-size:12px">图片过大已略去</span>';
    return `<img src="${esc(url)}" style="width:${w}px;height:${h}px;object-fit:cover;border-radius:10px" onerror="this.style.display='none'">`;
  }catch(_){return '';}
}
function pickImage(cb){
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.style.position='fixed';i.style.left='-9999px';i.style.top='-9999px';
  document.body.appendChild(i);
  i.onchange=async()=>{if(i.files[0]){cb(await imgToDataURL(i.files[0]));}document.body.removeChild(i);};
  i.click();
}

/* ---------- Default state ---------- */
const DEFAULT_COLUMNS=[
  {id:'todo',name:'每日待办',icon:'📝',bg:null,type:'todo'},
  {id:'diet',name:'减脂小妙招',icon:'🥗',bg:null,type:'diet'},
  {id:'grad',name:'研究生',icon:'🎓',bg:null,type:'grad'},
  {id:'exam',name:'备考',icon:'📚',bg:null,type:'exam'},
  {id:'work',name:'工作',icon:'💼',bg:null,type:'work'},
  {id:'english',name:'English',icon:'🔤',bg:null,type:'english'},
  {id:'career',name:'职业成长',icon:'🚀',bg:null,type:'career'},
  {id:'remind',name:'永久提醒',icon:'🔔',bg:null,type:'remind'},
  {id:'love',name:'恋爱小记录',icon:'💕',bg:'#ffe4ec',type:'love'},
  {id:'note',name:'随心笔记',icon:'📔',bg:'#e3f0fb',type:'note'},
  {id:'money',name:'小金库',icon:'💰',bg:null,type:'money'},
  {id:'future',name:'未来规划',icon:'🌟',bg:null,type:'future'},
];
function defaultState(){
  return {
    version:3,
    columns:JSON.parse(JSON.stringify(DEFAULT_COLUMNS)),
    bgColors:{}, moduleBg:{},
    privacyPassword:'1234',
    home:{motto:'',mood:'',images:[]},
    todo:{records:{}},
    diet:{tabs:['食谱','体重','饮食','运动'],
      recipes:[], weight:[], meals:[], exercise:[]},
    grad:{tabs:['毕业论文','提醒事项'],data:{}},
    exam:{tabs:['国考','省考','事业编','央国企','高校'],data:{},归纳:{}},
    work:{tabs:['央国企','私企','事业编','高校','其它'],data:{}},
    english:{collected:[],unknown:[],proficient:[],unproficient:[],history:{},cursor:null},
    career:[],remind:{tabs:['生活','做人','工作','恋爱','赚钱','其它'],data:{}},
    love:{anniversary:'',moodDaily:{},images:[],
      memory:[],wishTravel:[],wishFood:[],moodCalendar:{},
      secret:{habits:[],quarrel:[],heart:[],data:{},custom:{},extra:[]}},
    note:[],money:{avail:0,locked:0,records:[],reveal:false},
    future:[]
  };
}

/* ---------- Load / migrate ---------- */
let state;
function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){state=JSON.parse(raw);}
  }catch(e){console.warn('load err',e);}
  if(!state||state.version!==3){state=migrate(state);}
  // ensure nested defaults
  const d=defaultState();
  for(const k in d){if(state[k]===undefined)state[k]=d[k];}
  if(!state.diet.tabs)state.diet.tabs=d.diet.tabs;
  // 兜底：确保恋爱/碎碎念相关字段始终存在，避免旧数据导致渲染或交互报错
  const L=state.love||(state.love={});
  if(!L.secret)L.secret={};
  if(!L.secret.data)L.secret.data={};
  if(!L.secret.custom)L.secret.custom={};
  if(!L.secret.extra)L.secret.extra=[];
  if(!Array.isArray(L.wishTravel))L.wishTravel=[];
  if(!Array.isArray(L.wishFood))L.wishFood=[];
  // 彻底清理旧版遗留的食物图片 base64（不再保存图片，只识别热量），避免撑爆存储
  if(Array.isArray(state.diet.recipes))state.diet.recipes.forEach(r=>{if(r&&r.img){delete r.img;}});
  if(Array.isArray(state.diet.meals))state.diet.meals.forEach(m=>{if(m&&m.img){delete m.img;}});
}
function migrate(old){
  const d=defaultState();
  if(old&&old.columns)return Object.assign(d,old);
  if(old&&old.home)return Object.assign(d,old);
  return d;
}

/* ---------- Save ---------- */
let saveTimer;
const badge=$('#saveBadge'),saveText=$('#saveText');
function save(manual){
  clearTimeout(saveTimer);
  badge.style.display='flex';saveBadge.classList.add('saving');saveText.textContent='保存中…';
  saveTimer=setTimeout(()=>{
    try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){toast('保存失败：存储空间不足');}
    saveBadge.classList.remove('saving');saveText.textContent='已保存 ✓';
  },250);
  if(manual){toast('保存成功 ✓');}
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  let t=$('#toast');
  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------- helpers for state paths ---------- */
function getPath(p){return p.split('.').reduce((o,k)=>o?.[k],state);}
function setPath(p,v){const ks=p.split('.');let o=state;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;}

/* =========================================================
   RENDER
   ========================================================= */
let current='home';
let loveLastTap=0,loveLastIdx=-1;
function render(){
  renderNav();
  renderMain();
  const sb=$('#sidebar');
  if(sb)sb.style.backgroundColor=state.bgColors['sidebar']||'var(--cream)';
  const ub=$('#btnUndo');if(ub)ub.title='撤销「'+moduleName(current)+'」';
}
function renderNav(){
  const nav=$('#nav');
  let html=`<div class="nav-item ${current==='home'?'active':''}" data-go="home"><span class="ico">🏠</span>首页</div>`;
  for(const c of state.columns){
    const bg=state.bgColors[c.id];
    html+=`<div class="nav-item ${current===c.id?'active':''}" data-go="${c.id}" ${bg?`style="border-left:4px solid ${bg}"`:''}>
      <span class="ico">${c.icon||'📁'}</span>${esc(c.name)}</div>`;
  }
  nav.innerHTML=html;
}

function pageBg(id){
  const c=state.columns.find(c=>c.id===id);
  if(state.bgColors[id])return state.bgColors[id];
  if(c&&c.bg)return c.bg;
  if(id==='home')return 'var(--cream)';

function calendarHTML(){
  const now=new Date();const y=now.getFullYear(),m=now.getMonth();
  const first=new Date(y,m,1).getDay();const days=new Date(y,m+1,0).getDate();
  const wd=['日','一','二','三','四','五','六'];
  let g=wd.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<first;i++)g+=`<div class="cell dim"></div>`;
  const tday=now.getDate();
  for(let d=1;d<=days;d++)g+=`<div class="cell ${d===tday?'today':''}">${d}</div>`;
  return `<div class="cal round"><div class="chead"><b>${y}年${m+1}月</b></div><div class="grid">${g}</div></div>`;
}

function weightBody(){
  const list=state.diet.weight;
  const cards=list.map((w,i)=>{
    const bmi=w.height&&w.weight?(w.weight/Math.pow(w.height/100,2)).toFixed(1):'—';
    return `<div class="card">
      <div class="row">
        <div class="field"><label>身高(cm)</label><input class="inp" data-wp="height" data-i="${i}" type="number" value="${esc(w.height)}"></div>
        <div class="field"><label>体重(kg)</label><input class="inp" data-wp="weight" data-i="${i}" type="number" value="${esc(w.weight)}"></div>
        <div class="field"><label>BMI（自动计算）</label><input class="inp" data-bmi="${i}" value="${bmi}" readonly></div>
        <div class="field"><label>日期</label><input class="inp" data-wp="date" data-i="${i}" type="date" value="${esc(w.date)}"></div>
      </div>
      <button class="btn warn" data-act="wDel" data-i="${i}">删除此记录</button>
    </div>`;
  }).join('')+`<button class="btn" data-act="wAdd">＋ 添加体重记录</button>`;
  let chart='';
  if(list.length){
    const pts=list.filter(w=>w.date&&w.weight).sort((a,b)=>a.date<b.date?-1:1);
    if(pts.length){
      const W=540,H=220,padL=44,padR=18,padT=18,padB=34;
      const ws=pts.map(p=>parseFloat(p.weight));
      const awMin=Math.min(...ws),awMax=Math.max(...ws);
      let lo=Math.floor(awMin-1),hi=Math.ceil(awMax+1);
      if(lo===hi){lo-=1;hi+=1;}
      const X=i=>padL+(W-padL-padR)*i/(pts.length-1||1);
      const Y=v=>H-padB-(H-padT-padB)*(v-lo)/(hi-lo||1);
      let grid='';
      const steps=4;
      for(let s=0;s<=steps;s++){const v=lo+(hi-lo)*s/steps;const y=Y(v);grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#eee"/><text x="${padL-6}" y="${y+4}" font-size="10" fill="#999" text-anchor="end">${v}</text>`;}
      const line=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(parseFloat(p.weight))}" r="4" fill="#1f3a93"/>`).join('');
      const path=pts.map((p,i)=>`${i?'L':'M'}${X(i)},${Y(parseFloat(p.weight))}`).join(' ');
      const xl=pts.map((p,i)=>`<text x="${X(i)}" y="${H-12}" font-size="10" fill="#888" text-anchor="middle">${p.date.slice(5)}</text>`).join('');
      const last=parseFloat(pts[pts.length-1].weight),chg=last-awMin;
      const chgTxt=(chg>0?'+':'')+chg.toFixed(1)+' kg';
      const chgColor=chg<0?'#2a9d4a':(chg>0?'var(--warn)':'var(--text)');
      chart=`<div class="chart-wrap"><div style="font-weight:700;margin-bottom:6px;color:var(--accent)">📉 体重变化趋势图</div>
        <svg viewBox="0 0 ${W} ${H}" width="100%">${grid}<path d="${path}" fill="none" stroke="#1f3a93" stroke-width="2"/>${line}${xl}</svg>
        <div style="display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap">
          <span>最新：<b style="color:var(--text)">${last} kg</b></span>
          <span>最低：<b style="color:var(--text)">${awMin} kg</b></span>
          <span>最高：<b style="color:var(--text)">${awMax} kg</b></span>
          <span>较首条变化：<b style="color:${chgColor}">${chgTxt}</b></span>
          <span>记录数：<b style="color:var(--text)">${pts.length}</b></span>
        </div></div>`;
    }
  }
  return cards+chart;
}

function countdown(date){
  const t=Date.parse(date),n=Date.now();if(isNaN(t))return '';
  const d=Math.ceil((t-n)/86400000);
  return d>0?`距考试还有 ${d} 天`:(d===0?'今天考试！':'考试已过去 '+Math.abs(d)+' 天');
}
function cdDays(date){const t=Date.parse(date),n=Date.now();if(isNaN(t))return null;return Math.ceil((t-n)/86400000);}

function englishView(){
  const e=state.english;
  if(e.cursor==null)e.cursor=Math.floor(Date.now()/86400000)%EN_DIALOG.length;
  const dayIdx=Math.floor(Date.now()/86400000)%EN_DIALOG.length;
  const cur=e.cursor;
  const dlg=EN_DIALOG[cur];
  const stars=e.collected.includes(cur)?'⭐':'☆';
  const prof=e.proficient.includes(cur)?'✅':'';
  const unp=e.unproficient.includes(cur)?'⚠️':'';
  const words=dlg.en.split(' ');
  const wordSpans=words.map(w=>`<span class="eword" data-word="${esc(w.replace(/[^a-zA-Z']/g,''))}" style="cursor:pointer;border-bottom:1px dotted var(--accent)">${esc(w)}</span>`).join(' ');
  const dateStr=todayStr();
  e.history[dateStr]=e.history[dateStr]||0;

  if(e.proficient.length||e.unproficient.length){

      <div><b style="color:var(--accent)">熟练：</b>${e.proficient.map(i=>esc(EN_DIALOG[i].en)).join('；')||'—'}</div>
      <div><b style="color:var(--warn)">不熟练：</b>${e.unproficient.map(i=>esc(EN_DIALOG[i].en)).join('；')||'—'}</div>

/* ---------- Remind (永久提醒)  improvement 11: 去掉归纳 ---------- */
function remindView(){
  const d=state.remind;const tab=d.remindTab||d.tabs[0];
  const tabs=d.tabs.map(t=>`<div class="sub-tab ${tab===t?'active':''}" data-act="remindTab" data-t="${t}">${t}</div>`).join('');
  d.data[tab]=d.data[tab]||[];
  const cards=d.data[tab].map((it,i)=>`<div class="card">
    <div class="field"><label>标题</label><input class="inp" data-rm="title" data-i="${i}" value="${esc(it.title)}"></div>
    <div class="field"><label>内容</label><textarea class="txt" data-rm="content" data-i="${i}">${esc(it.content)}</textarea></div>
    <button class="btn warn" data-act="rmDel" data-i="${i}">删除</button>
  </div>`).join('');
  return `<div class="sec-title">🔔 永久提醒</div><div class="sub-tabs">${tabs}</div>${cards}<button class="btn" data-act="rmAdd">＋ 新增</button>`;
}

/* ---------- Love (恋爱小记录)  improvement 1 ---------- */
function loveView(){
  const L=state.love;const tab=L.tab||'纪念日';
  const anniv=L.anniversary?Math.floor((Date.now()-Date.parse(L.anniversary))/86400000):'—';
  const today=todayStr();
  const moodDaily=L.moodDaily[today]||'🙂';
  const topImgs=L.images.map((s,i)=>`<img class="top-img" src="${esc(s)}" data-act="loveImgDel" data-i="${i}" title="双击删除图片" style="cursor:pointer">`).join('');
  const tabs=['纪念日','愿望清单','心情汇总','碎碎念'].map(t=>`<div class="sub-tab ${tab===t?'active':''}" data-act="loveTab" data-t="${t}">${t}</div>`).join('');
  const addBtn=`<div class="sub-tab" data-act="loveAddTab">＋</div>`;
  let body='';
  if(tab==='纪念日')body=loveMemory();
  else if(tab==='愿望清单')body=loveWish();
  else if(tab==='心情汇总')body=loveMoodCal();
  else if(tab==='碎碎念')body=loveSecret();
  else body=loveCustom(tab);
  return `<div class="love" style="background:${pageBg('love')}">
    <div class="love-top">
      <div class="love-info">
        <div class="days">相恋 <b>${anniv}</b> 天</div>
        <div class="days" style="font-size:13px;font-weight:500;margin-top:6px">在一起日期：
          <input class="inp rounded" data-bind="love.anniversary" type="date" value="${esc(L.anniversary)}" style="max-width:172px;width:auto;display:inline-block;font-size:13px;padding:4px 8px;vertical-align:middle">
        </div>
        <div class="days" style="font-size:13px;font-weight:500;margin-top:4px">${today} · 心情 <button class="mood-btn" style="padding:4px 10px;font-size:13px" data-act="loveMood">${moodDaily}</button></div>
      </div>
      <div class="love-imgs">${topImgs}<button class="btn ghost" data-act="loveImgAdd" style="margin-left:4px">＋图片</button></div>
    </div>
    <div class="sub-tabs">${tabs}${addBtn}</div>
    <div class="content">${body}</div>
  </div>`;
}
function loveMemory(){
  const list=Array.isArray(state.love.memory)?state.love.memory:[];
  return list.map((m,i)=>{
    m=m||{};
    const cd=m.date?`距 ${m.date} 还有 ${Math.ceil((Date.parse(m.date)-Date.now())/86400000)} 天`:'';
    return `<div class="bubble lm-bubble">
      <div class="row" style="align-items:center;gap:8px">
        <span class="heart" style="font-size:18px;flex-shrink:0">💗</span>
        <input class="inp rounded" data-lm="date" data-i="${i}" type="date" value="${esc(m.date)}" title="日期" style="flex:0 0 auto;width:120px;min-width:0;font-size:14px;padding:8px 8px">
        <input class="inp rounded" data-lm="text" data-i="${i}" value="${esc(m.text)}" placeholder="纪念日描述…" style="flex:1 1 auto;min-width:0;font-size:15px;padding:8px 10px">
        <button class="btn-x" data-act="lmDel" data-i="${i}" title="删除" style="margin-left:auto">×</button>
      </div>

    </div>`;
  }).join('')+`<button class="btn lm-add-btn" data-act="lmAdd">＋ 添加纪念日</button>`;
}
function loveWish(){
  const travel=state.love.wishTravel, food=state.love.wishFood;
  const sec=(arr,key,title)=>`<div class="wish-sec"><h4>${title}</h4>${
    arr.map((it,i)=>`<div class="bubble" style="display:flex;align-items:center;gap:8px"><span class="heart">💗</span><input class="inp rounded" data-lw="text" data-k="${key}" data-i="${i}" value="${esc(it.text)}" placeholder="写下一个愿望…" style="flex:1;border:none;background:transparent;font-size:15px;padding:10px 12px"><button class="btn warn" data-act="lwDel" data-k="${key}" data-i="${i}" style="flex-shrink:0">删除</button></div>`).join('')
  }<button class="btn ghost" data-act="lwAdd" data-k="${key}" style="margin-top:8px">＋ 添加</button></div>`;
  return `${sec(travel,'wishTravel','🧳 旅游')}${sec(food,'wishFood','🍜 美食')}`;
}
function loveMoodCal(){
  const now=new Date();const y=now.getFullYear(),m=now.getMonth();
  const first=new Date(y,m,1).getDay();const days=new Date(y,m+1,0).getDate();
  const mc=state.love.moodCalendar;
  let g='';
  for(let i=0;i<first;i++)g+=`<div class="cell dim"></div>`;
  for(let d=1;d<=days;d++){
    const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const em=mc[key]?mc[key].emoji:'';
    g+=`<div class="cell" data-act="moodCell" data-k="${key}" style="cursor:pointer;font-size:18px">${em||d}</div>`;
  }
  return `<div class="card"><div class="cal round"><div class="chead"><b>${y}年${m+1}月 心情汇总</b></div><div class="grid">${g}</div></div><p style="color:var(--muted);font-size:13px">点击日期查看/编辑当日心情备注；双击表情可输入文字。</p></div>`;
}

/* =========================================================
   EVENT BINDING  (bound once at init; innerHTML is replaced on render)
   ========================================================= */
function setupListeners(){
  const main=$('#main');
  main.addEventListener('input',onInput);
  main.addEventListener('change',onInput);
  main.addEventListener('click',onClick);
  // 进入输入框即记录一步，便于"撤销上一步"
  main.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('input,textarea,select'))pushUndo();});
  // 双击编辑「不可动用余额」
  main.addEventListener('dblclick',e=>{
    const b=e.target.closest('[data-act="moneyEditLocked"]');
    if(b){const v=prompt('设置不可动用余额（数字）：',state.money.locked);if(v!==null){const n=parseFloat(v);if(!isNaN(n)){state.money.locked=n;recalcMoney();save();render();}} }
  });
  $('#sidebar').addEventListener('click',e=>{
    const go=e.target.closest('[data-go]');
    if(go){current=go.dataset.go;if(window.innerWidth<=760)$('#sidebar').classList.remove('open');render();}
  });
}
function onInput(e){
  const t=e.target;
  if(t.dataset.bind){setPath(t.dataset.bind,t.value);save();if(t.dataset.bind==='love.anniversary'&&e.type==='change')render();return;}
  if(t.dataset.todo!==undefined){const i=+t.dataset.todo;state.todo.records[todayStr()].items[i].text=t.value;save();return;}
  if(t.dataset.rp){const r=state.diet.recipes[+t.dataset.i];r[t.dataset.rp]=t.value;save();return;}
  if(t.dataset.wp){const w=state.diet.weight[+t.dataset.i];w[t.dataset.wp]=t.value;
    const bi=document.querySelector('[data-bmi="'+t.dataset.i+'"]');
    if(bi)bi.value=(w.height&&w.weight)?(w.weight/Math.pow(w.height/100,2)).toFixed(1):'—';
    if(e.type==='change')render();
    save();return;}
  if(t.dataset.mp){const m=state.diet.meals[+t.dataset.i];m[t.dataset.mp]=t.value;save();return;}
  if(t.dataset.ep){const it=state.diet.exercise[+t.dataset.i].items[+t.dataset.j];it[t.dataset.ep]=t.value;save();return;}
  if(t.dataset.ex){const x=state.diet.exercise[+t.dataset.i];x[t.dataset.ex]=t.value;save();return;}
  if(t.dataset.gp){const arr=currentArr();arr[+t.dataset.i][t.dataset.gp]=t.value;save();return;}

function currentArr(){

/* ---------- Undo (每个模块各自独立的撤销历史) ---------- */
// 每个模块维护自己的快照栈，只保存该模块的数据片段，互相不会干扰
const undoStacks={};
// 返回某模块在 state 中的「数据片段」引用
function moduleSection(key){
  if(key&&key.startsWith('custom')){state.custom=state.custom||{};state.custom[key]=state.custom[key]||[];return state.custom[key];}
  switch(key){
    case 'home':return state.home;
    case 'todo':return state.todo;
    case 'diet':return state.diet;
    case 'grad':return state.grad;
    case 'exam':return state.exam;
    case 'work':return state.work;
    case 'english':return state.english;
    case 'career':return state.career;
    case 'remind':return state.remind;
    case 'love':return state.love;
    case 'note':return state.note;
    case 'money':return state.money;
    case 'future':return state.future;
  }
  return null;
}
// 把某模块的数据片段整体替换为 val
function assignModule(key,val){
  if(key&&key.startsWith('custom')){state.custom=state.custom||{};state.custom[key]=val;return;}
  switch(key){
    case 'home':state.home=val;break;
    case 'todo':state.todo=val;break;
    case 'diet':state.diet=val;break;
    case 'grad':state.grad=val;break;
    case 'exam':state.exam=val;break;
    case 'work':state.work=val;break;
    case 'english':state.english=val;break;
    case 'career':state.career=val;break;
    case 'remind':state.remind=val;break;
    case 'love':state.love=val;break;
    case 'note':state.note=val;break;
    case 'money':state.money=val;break;
    case 'future':state.future=val;break;
  }
}
function moduleName(key){const c=state.columns.find(x=>x.id===key);return c?c.name:key;}
// 各模块的子标签字段（撤销时保留当前所在的子标签，避免被"带回"）
const MODULE_TAB_FIELDS={
  diet:['dietTab'], grad:['gradTab'], exam:['examTab'],
  work:['workTab'], remind:['remindTab'], love:['tab','secret.tab']
};
function getField(root,path){return path.split('.').reduce((o,k)=>o?o[k]:undefined,root);}
function setField(root,path,v){const ks=path.split('.');const last=ks.pop();let o=root;for(const k of ks)o=o[k]=(o[k]||{});o[last]=v;}
function pushUndo(key){
  key=key||current;
  try{const sec=moduleSection(key);if(sec===null)return;
    (undoStacks[key]=undoStacks[key]||[]).push(JSON.stringify(sec));
    if(undoStacks[key].length>60)undoStacks[key].shift();
  }catch(e){}
}
function undo(key){
  key=key||current;
  const st=undoStacks[key];
  if(!st||!st.length){toast('「'+moduleName(key)+'」没有可撤销的步骤');return;}
  // 记住当前子标签，撤销后还原，避免子标签被切走
  const fields=MODULE_TAB_FIELDS[key]||[];
  const keep={};fields.forEach(f=>{const r=moduleSection(key);keep[f]=getField(r,f);});
  try{
    assignModule(key,JSON.parse(st.pop()));
    const r2=moduleSection(key);
    fields.forEach(f=>{if(keep[f]!==undefined)setField(r2,f,keep[f]);});
  }catch(e){return;}
  save();render();toast('已撤销「'+moduleName(key)+'」上一步 ↩');
}

function recognizeMeal(i){
  pickImage(src=>{
    if(!src){toast('图片读取失败，请重试');return;}
    const f=mockFood();
    state.diet.meals[i].food=f.name;state.diet.meals[i].cal=f.cal;
    try{save();}catch(_){}
    render();toast('已识别：'+f.name+' '+f.cal+' kcal');
  });
}

/* ---------- Money ---------- */
function moneyAdd(){
  const type=$('#mType').value,cat=$('#mCat').value,amt=parseFloat($('#mAmt').value)||0,date=$('#mDate').value,note=$('#mNote').value;
  const signed=type==='收入'?amt:-amt;
  state.money.records.push({type,cat,amount:signed,date,note});
  recalcMoney();save();render();
}
function recalcMoney(){
  // 可动用余额 = 所有收入/支出记录的净额；不可动用余额为手动设置（双击编辑），不随记录变动
  let avail=0;
  for(const r of state.money.records){avail+=r.amount;}
  state.money.avail=avail;
  if(typeof state.money.locked!=='number')state.money.locked=0;
}
function moneyReveal(){
  if(state.money.reveal){state.money.reveal=false;save();render();return;}
  const v=prompt('请输入隐私密码查看余额：',state.privacyPassword);
  if(v===state.privacyPassword){state.money.reveal=true;save();render();}else if(v!==null)toast('密码错误');
}

function openAdmin(){
  const ov=document.createElement('div');ov.className='overlay';
  const colRows=state.columns.map((c,idx)=>`<div class="col-row">
    <span class="ico-btn" data-ad="colUp" data-i="${idx}">⬆️</span>
    <span class="ico-btn" data-ad="colDown" data-i="${idx}">⬇️</span>
    <span class="ico-btn" data-ad="colIcon" data-i="${idx}" title="换图标">${c.icon||'📁'}</span>

    <button class="mini" data-ad="colRename" data-i="${idx}">改名</button>
    ${c.type!=='todo'&&c.type!=='diet'&&c.type!=='love'&&c.type!=='note'&&c.type!=='money'?'':''}

  </div>`).join('');
  ov.innerHTML=`<div class="modal"><span class="close" data-x>×</span><h3>⚙️ 超级管理员</h3>
    <div class="admin-section"><h4>🎨 底色管理</h4>
      <div class="row" style="align-items:center;margin-bottom:8px">
        <select class="inp" id="bgTarget" style="flex:2">${bgTargets()}</select>
        <div id="bgPreview" style="width:40px;height:40px;border-radius:8px;border:1px solid #ccc"></div>

      </div>
      <div id="colorPicker"></div>
    </div>
    <div class="admin-section"><h4>🖼 模块背景图（每张独立）</h4>
      <div class="row" style="align-items:center">
        <select class="inp" id="bgImgTarget" style="flex:2">${bgTargets()}</select>
        <button class="btn ghost" data-ad="bgImgSet">设置背景图</button>
        <button class="btn ghost" data-ad="bgImgDel">清除</button>
      </div>
    </div>
    <div class="admin-section"><h4>📋 栏目管理（侧边导航）</h4>${colRows}
      <button class="btn" data-ad="colAdd">＋ 新增自定义栏目</button>
    </div>
    <div class="admin-section"><h4>🏷 子模块管理</h4>
      ${subModuleAdmin()}
    </div>
    <div class="admin-section"><h4>🔒 隐私密码</h4>
      <button class="btn ghost" data-ad="setPwd">设置碎碎念/小金库密码</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  renderColorPicker(ov);
  ov.onclick=e=>{
    if(e.target===ov||e.target.hasAttribute('data-x'))ov.remove();
    const ad=e.target.dataset.ad;if(!ad)return;
    adminAct(ad,e,ov);
  };
}
function bgTargets(){
  let o=`<option value="sidebar">侧边栏</option><option value="home">首页</option>`;
  for(const c of state.columns)o+=`<option value="${c.id}">${esc(c.name)}</option>`;
  return o;
}
function renderColorPicker(ov){
  const box=ov.querySelector('#colorPicker');const tgt=ov.querySelector('#bgTarget').value;
  ov.querySelector('#bgPreview').style.background=state.bgColors[tgt]||pageBg(tgt);
  let html='';
  for(const fam in COLOR_FAMILIES){
    html+=`<div class="color-fam">${fam}</div><div class="color-grid">${COLOR_FAMILIES[fam].map(c=>`<button data-col="${c}" style="background:${c}"></button>`).join('')}</div>`;
  }
  html+=`<div class="color-fam">手动输入</div><div class="row"><input class="inp" id="customCol" placeholder="#RRGGBB"><button class="btn" data-ad="bgCustom">应用</button></div>`;
  box.innerHTML=html;
  box.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{
    const tgt=ov.querySelector('#bgTarget').value;state.bgColors[tgt]=b.dataset.col;save();ov.querySelector('#bgPreview').style.background=b.dataset.col;render();
  });
}
function adminAct(ad,e,ov){
  const i=e.target.dataset.i!==undefined?+e.target.dataset.i:undefined;
  switch(ad){
    case 'colUp':if(i>0){[state.columns[i-1],state.columns[i]]=[state.columns[i],state.columns[i-1]];save();openAdmin();}break;
    case 'colDown':if(i<state.columns.length-1){[state.columns[i+1],state.columns[i]]=[state.columns[i],state.columns[i+1]];save();openAdmin();}break;
    case 'colIcon':{const em=prompt('输入emoji图标：',state.columns[i].icon);if(em){state.columns[i].icon=em;save();openAdmin();}break;}
    case 'colRename':{const nm=prompt('新名称：',state.columns[i].name);if(nm){state.columns[i].name=nm;save();openAdmin();}break;}
    case 'colDel':if(confirm('确定删除该栏目及其数据？')){state.columns.splice(i,1);save();openAdmin();render();}break;
    case 'colAdd':{const nm=prompt('栏目名称：');if(nm){const col={id:'c_'+uid(),name:nm,icon:'📁',bg:null,type:'custom'};state.columns.push(col);state.custom=state.custom||{};state.custom[col.id]=[];save();openAdmin();render();}break;}
    case 'bgReset':{const t=ov.querySelector('#bgTarget').value;delete state.bgColors[t];save();renderColorPicker(ov);render();break;}
    case 'bgCustom':{const v=ov.querySelector('#customCol').value.trim();if(v){const t=ov.querySelector('#bgTarget').value;state.bgColors[t]=v;save();ov.querySelector('#bgPreview').style.background=v;render();}break;}
    case 'bgImgSet':pickImage(src=>{const t=ov.querySelector('#bgImgTarget').value;state.moduleBg[t]=src;save();render();toast('背景图已设置');});break;
    case 'bgImgDel':{const t=ov.querySelector('#bgImgTarget').value;delete state.moduleBg[t];save();render();break;}
    case 'subAdd':{const mod=e.target.dataset.mod;const nm=prompt('子模块名称：');if(nm){state[mod].tabs.push(nm);if(state[mod].data)state[mod].data[nm]=[];save();openAdmin();}break;}
    case 'subRename':{const mod=e.target.dataset.mod;const idx=+e.target.dataset.idx;const nm=prompt('新名称：',state[mod].tabs[idx]);if(nm){const old=state[mod].tabs[idx];state[mod].tabs[idx]=nm;if(state[mod].data){state[mod].data[nm]=state[mod].data[old]||[];delete state[mod].data[old];}save();openAdmin();}break;}
    case 'subDel':{const mod=e.target.dataset.mod;const idx=+e.target.dataset.idx;state[mod].tabs.splice(idx,1);save();openAdmin();break;}
    case 'setPwd':{const v=prompt('设置隐私密码：',state.privacyPassword);if(v){state.privacyPassword=v;save();toast('已设置');}break;}
  }
}
function subModuleAdmin(){
  const mods=[['diet','减脂小妙招'],['grad','研究生'],['exam','备考'],['work','工作'],['remind','永久提醒']];
  return mods.map(([mod,label])=>{
    const tabs=(state[mod].tabs||[]).map((t,idx)=>`<span class="chip" style="display:inline-flex;gap:4px;align-items:center;background:#f0e7d3;border-radius:14px;padding:3px 8px;margin:3px">${esc(t)}
      <button class="mini" data-ad="subRename" data-mod="${mod}" data-idx="${idx}">改</button>
      <button class="mini" data-ad="subDel" data-mod="${mod}" data-idx="${idx}">×</button></span>`).join('');
    return `<div style="margin-bottom:10px"><b>${label}</b><div>${tabs}</div><button class="btn ghost" data-ad="subAdd" data-mod="${mod}">＋ 子模块</button></div>`;
  }).join('');
}

function openExport(){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal"><span class="close" data-x>×</span><h3>📤 导出数据</h3>
    <button class="btn" data-ex="json" style="display:block;width:100%;margin-bottom:8px">导出 JSON（备份）</button>
    <button class="btn" data-ex="word" style="display:block;width:100%;margin-bottom:8px">导出 Word 文档</button>
    <button class="btn" data-ex="pdf" style="display:block;width:100%;margin-bottom:8px">导出 PDF</button>
    <button class="btn" data-ex="csv" style="display:block;width:100%">导出 小金库 CSV</button>
  </div>`;
  ov.onclick=e=>{
    if(e.target===ov||e.target.hasAttribute('data-x'))ov.remove();
    const ex=e.target.dataset.ex;if(!ex)return;
    if(ex==='json')exportJSON();
    if(ex==='word')exportWord();
    if(ex==='pdf')exportPDF();
    if(ex==='csv')exportCSV();
  };
  document.body.appendChild(ov);
}
function download(name,content,mime){
  const blob=new Blob([content],{type:mime});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);
}
function exportJSON(){download('思敏工作台数据.json',JSON.stringify(state,null,2),'application/json');toast('已导出 JSON');}
function exportCSV(){
  let rows=[['日期','类型','分类','金额','备注']];
  for(const r of state.money.records)rows.push([r.date,r.type,r.cat,r.amount,r.note||'']);
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  download('小金库记录.csv',csv,'text/csv');toast('已导出 CSV');
}
function buildDocHTML(){
  const s=state;let h=`<h1>思敏工作台 · 数据导出</h1><p>导出时间：${new Date().toLocaleString()}</p>`;
  h+=`<h2>首页箴言</h2><p>${esc(s.home.motto)||'（空）'}</p><p>今日心情：${esc(s.home.mood)}</p>`;
  for(const c of s.columns){
    h+=`<h2>${esc(c.name)}</h2>`;
    if(c.type==='todo'){const rec=s.todo.records[todayStr()];if(rec)h+='<ul>'+rec.items.filter(i=>i.text).map(i=>`<li>${esc(i.text)} ${i.done?'(已完成)':''}</li>`).join('')+'</ul>';}
    else if(c.type==='diet'){h+='<h3>食谱</h3>'+s.diet.recipes.map(r=>`<p>${esc(r.name)}｜热量${esc(r.cal)}｜食材${esc(r.ing)}</p>`).join('');h+='<h3>体重</h3>'+s.diet.weight.map(w=>`<p>${esc(w.date)} 身高${esc(w.height)} 体重${esc(w.weight)}</p>`).join('');h+='<h3>饮食</h3>'+s.diet.meals.map(m=>`<p>${esc(m.date)} ${esc(m.type)} ${esc(m.food)} ${esc(m.cal)}kcal</p>`).join('');h+='<h3>运动</h3>'+s.diet.exercise.map(x=>`<p>${esc(x.date)} ${esc(x.kind)}</p>`).join('');}
    else if(c.type==='grad'){for(const t of s.grad.tabs)h+=`<h3>${esc(t)}</h3>`+(s.grad.data[t]||[]).map(it=>`<p><b>${esc(it.title)}</b>：${esc(it.content)}</p>`).join('');}
    else if(c.type==='exam'){for(const t of s.exam.tabs)h+=`<h3>${esc(t)}</h3>`+(s.exam.data[t]||[]).map(it=>`<p><b>${esc(it.title)}</b>（${esc(it.归纳)}）：${esc(it.content)}</p>`).join('');}
    else if(c.type==='work'){for(const t of s.work.tabs)h+=`<h3>${esc(t)}</h3>`+(s.work.data[t]||[]).map(it=>`<p><b>${esc(it.company)}</b>｜${esc(it.post)}｜${esc(it.review)}</p>`).join('');}
    else if(c.type==='career')h+=s.career.map(it=>`<p><b>${esc(it.title)}</b>（${esc(it.difficulty)}）：${esc(it.content)}</p>`).join('');
    else if(c.type==='remind'){for(const t of s.remind.tabs)h+=`<h3>${esc(t)}</h3>`+(s.remind.data[t]||[]).map(it=>`<p><b>${esc(it.title)}</b>：${esc(it.content)}</p>`).join('');}
    else if(c.type==='love'){h+=`<p>相恋纪念日：${esc(s.love.anniversary)}</p><h3>纪念日</h3>`+s.love.memory.map(m=>`<p>${esc(m.date)} ${esc(m.text)}</p>`).join('')+`<h3>愿望-旅游</h3>`+s.love.wishTravel.map(w=>`<p>${esc(w.text)}</p>`).join('')+`<h3>愿望-美食</h3>`+s.love.wishFood.map(w=>`<p>${esc(w.text)}</p>`).join('');}
    else if(c.type==='note')h+=s.note.map(n=>`<p>${esc(n.content)}</p>`).join('');}
  return h;
}
function exportWord(){
  const html=`<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'></head><body>${buildDocHTML()}</body></html>`;
  download('思敏工作台.docx',html,'application/msword');
  toast('已导出 Word');
}
function exportPDF(){
  const w=window.open('','_blank');
  w.document.write(`<html><head><meta charset='utf-8'><title>思敏工作台</title><style>body{font-family:Microsoft YaHei;padding:30px}h1,h2,h3{color:#1f3a93}li{margin:4px 0}</style></head><body>${buildDocHTML()}<script>window.onload=function(){window.print()}<\/script></body></html>`);
  w.document.close();
}

load();recalcMoney();

$('#btnUndo').onclick=()=>undo();
function toggleSidebar(show){
  const sb=$('#sidebar'),app=$('#app');
  if(window.innerWidth<=760){
    if(show===true)sb.classList.add('open');
    else if(show===false)sb.classList.remove('open');
    else sb.classList.toggle('open');
  }else{
    if(show===true)app.classList.remove('side-hidden');
    else if(show===false)app.classList.add('side-hidden');
    else app.classList.toggle('side-hidden');
  }
}
$('#hamburger').onclick=()=>toggleSidebar();
// 滑动手势：向左划隐藏侧边栏，向右划显示
(function(){
  const app=$('#app');let sx=0,sy=0,swiping=false;
  app.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;swiping=true;},{passive:true});
  app.addEventListener('touchend',e=>{
    if(!swiping)return;swiping=false;
    const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.4)return; // 仅响应明显横向滑动
    toggleSidebar(dx>0); // 右滑(>0)显示，左滑隐藏
  },{passive:true});
})();
setupListeners();
render();
// register service worker (PWA offline)
if(navigator.serviceWorker&&navigator.serviceWorker.register){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
